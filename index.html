<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocal 敬拜和聲魔法 | 實戰教學系統</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; overflow-x: hidden; }
        .animate-in { animation: slideUp 0.5s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #root:empty::after { content: "和聲魔法加載中..."; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 700; color: #94a3b8; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Mic: (<><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></>),
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
                Home: (<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>),
                Check: <polyline points="20 6 9 17 4 12"/>,
                ChevronRight: <path d="m9 18 6-6-6-6"/>,
                ChevronLeft: <path d="m15 18-6-6 6-6"/>,
                Trophy: (<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>),
                Star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const modulesData = [
            {
                id: 'm1', title: '單元一：聽覺直覺訓練', description: '色彩與跳格法應用',
                slides: [
                    { title: '聽出顏色的情緒', content: '大三度像陽光般開闊，小三度像月光般憂傷。\n和聲不是計算，是捕捉歌曲當下的空氣感。' },
                    { title: '即時反應：跳格法', content: '主唱唱 1，你跳過 2 唱 3。\n這種「平行三度」是流行敬拜中最專業的聲音。' }
                ],
                quizzes: [
                    { q: "進入「渴慕、呼求」段落時，哪種色彩最適合？", options: ["大三度 (陽光)", "小三度 (月光)"], correct: 1, exp: ["太明亮會破壞氣氛。", "正確！小三度能襯托感性與張力。"] },
                    { q: "主唱唱 2 (Re)，根據跳格法你該唱？", options: ["4 (Fa)", "3 (Mi)"], correct: 0, exp: ["正確！跳過 3 就是 4。", "錯誤。這會產生不和諧的摩擦音。"] },
                    { q: "在副歌宣告（如：祢真偉大）時，通常使用？", options: ["大三度", "小三度"], correct: 0, exp: ["正確！大三度能帶出宣告的榮耀感。", "小三度會顯得過於陰沉。"] }
                ]
            },
            {
                id: 'm2', title: '單元二：垂直 DNA 邏輯', description: '安全成員音與地基',
                slides: [
                    { title: '蓋房子比喻：1-3-5', content: '每個和弦都是一棟房子，由 1、3、5 組成。\n只要唱這三個成員之一，你絕對不會撞音。' },
                    { title: '救命繩：回歸根音', content: '如果快歌來不及思考，請立刻唱出和弦根音 (1)。\n這能讓團隊聲音立刻變穩定。' }
                ],
                quizzes: [
                    { q: "當司琴彈 Am (6-1-3) 時，哪個音決定它的憂鬱特質？", options: ["6 (根音)", "1 (三音)"], correct: 1, exp: ["根音決定名稱，非特質。", "正確！三音 1 決定了小調的靈魂。"] },
                    { q: "在 C 和弦中，主唱唱 5，你唱 1，你唱的是？", options: ["根音", "五音"], correct: 0, exp: ["正確！1 是 C 的地基根音。", "5 才是五音。"] },
                    { q: "最保險的和聲做法是首拍精準踩在？", options: ["根音", "隨便一個音"], correct: 0, exp: ["正確！根音能給會眾安全感。", "這會讓音樂聽起來像在打架。"] }
                ]
            }
        ];

        function App() {
            const [view, setView] = useState('home');
            const [currentModIdx, setCurrentModIdx] = useState(0);
            const [currentSlide, setCurrentSlide] = useState(0);
            const [quizIdx, setQuizIdx] = useState(0);
            const [isQuizMode, setIsQuizMode] = useState(false);
            const [selectedAns, setSelectedAns] = useState(null);
            const [correctCount, setCorrectCount] = useState(0);
            const [progress, setProgress] = useState({});

            const enterModule = (idx) => {
                setCurrentModIdx(idx); setCurrentSlide(0); setQuizIdx(0);
                setIsQuizMode(false); setSelectedAns(null); setCorrectCount(0);
                setView('content');
            };

            const handleAnswer = (idx) => {
                if (selectedAns !== null) return;
                setSelectedAns(idx);
                if (idx === modulesData[currentModIdx].quizzes[quizIdx].correct) {
                    setCorrectCount(prev => prev + 1);
                }
            };

            const nextAction = () => {
                const mod = modulesData[currentModIdx];
                if (!isQuizMode) {
                    if (currentSlide < mod.slides.length - 1) setCurrentSlide(s => s + 1);
                    else setIsQuizMode(true);
                } else {
                    if (quizIdx < mod.quizzes.length - 1) {
                        setQuizIdx(q => q + 1); setSelectedAns(null);
                    } else {
                        // 檢查是否達標 (累積答對 3 題)
                        if (correctCount >= 3) {
                            setProgress(p => ({ ...p, [mod.id]: true }));
                            setView('home');
                        } else {
                            alert(`您只答對 ${correctCount} 題，需答對 3 題才能通過。請重新挑戰！`);
                            enterModule(currentModIdx);
                        }
                    }
                }
            };

            return (
                <div className="min-h-screen pb-12">
                    <nav className="p-6 flex justify-between items-center max-w-5xl mx-auto">
                        <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setView('home')}>
                            <div className="bg-blue-600 p-2 rounded-xl text-white"><Icon name="Mic" size={20} /></div>
                            <span className="font-black text-xl tracking-tighter uppercase">Vocal Magic</span>
                        </div>
                        <div className="text-slate-400 font-bold text-sm">目標：累積答對 3 題</div>
                    </nav>

                    {view === 'home' && (
                        <main className="max-w-5xl mx-auto p-6 animate-in">
                            <h1 className="text-5xl font-black mb-12 tracking-tighter">我的<span className="text-blue-600">教學路徑</span></h1>
                            <div className="grid md:grid-cols-2 gap-6">
                                {modulesData.map((m, idx) => (
                                    <div key={m.id} onClick={() => enterModule(idx)} className={`p-8 rounded-[2.5rem] border-2 cursor-pointer transition-all ${progress[m.id] ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-100 hover:border-blue-500'}`}>
                                        <div className="flex justify-between items-start mb-4">
                                            <span className="text-xs font-black text-blue-600 uppercase tracking-widest">Module 0{idx+1}</span>
                                            {progress[m.id] && <Icon name="Check" className="text-blue-600" />}
                                        </div>
                                        <h3 className="text-2xl font-bold mb-2">{m.title}</h3>
                                        <p className="text-slate-400 font-medium">{m.description}</p>
                                    </div>
                                ))}
                            </div>
                        </main>
                    )}

                    {view === 'content' && (
                        <div className="max-w-3xl mx-auto p-6 animate-in">
                            <div className="bg-white rounded-[3rem] p-10 shadow-2xl border border-slate-100">
                                {!isQuizMode ? (
                                    <div className="min-h-[300px]">
                                        <h2 className="text-3xl font-black mb-8">{modulesData[currentModIdx].slides[currentSlide].title}</h2>
                                        <p className="text-xl text-slate-600 leading-relaxed italic whitespace-pre-line">{modulesData[currentModIdx].slides[currentSlide].content}</p>
                                    </div>
                                ) : (
                                    <div className="min-h-[300px]">
                                        <div className="flex justify-between items-center mb-6">
                                            <span className="text-amber-500 font-black text-xs uppercase tracking-widest">實戰考驗 {quizIdx + 1}/3</span>
                                            <span className="text-blue-600 font-black text-sm">已對: {correctCount}</span>
                                        </div>
                                        <h2 className="text-2xl font-black mb-8">{modulesData[currentModIdx].quizzes[quizIdx].q}</h2>
                                        <div className="space-y-4">
                                            {modulesData[currentModIdx].quizzes[quizIdx].options.map((opt, i) => (
                                                <button key={i} onClick={() => handleAnswer(i)} className={`w-full p-6 rounded-2xl text-left font-bold transition-all border-4 ${selectedAns === i ? (i === modulesData[currentModIdx].quizzes[quizIdx].correct ? 'border-emerald-500 bg-emerald-50' : 'border-red-500 bg-red-50') : 'border-slate-50 bg-slate-50 hover:border-blue-100'}`}>
                                                    {opt}
                                                    {selectedAns === i && <p className={`mt-2 text-sm italic ${i === modulesData[currentModIdx].quizzes[quizIdx].correct ? 'text-emerald-700' : 'text-red-700'}`}>{modulesData[currentModIdx].quizzes[quizIdx].exp[i]}</p>}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                <button onClick={nextAction} disabled={isQuizMode && selectedAns === null} className="w-full mt-10 py-5 bg-slate-900 text-white rounded-2xl font-black text-lg hover:bg-blue-600 transition-all disabled:opacity-20">
                                    {isQuizMode && quizIdx === 2 ? '完成單元並結算' : '繼續下一步'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const startApp = () => {
            const rootEl = document.getElementById('root');
            if (rootEl) {
                const root = ReactDOM.createRoot(rootEl);
                root.render(<App />);
            }
        };
        startApp();
    </script>
</body>
</html>
